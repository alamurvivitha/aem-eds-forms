name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node -v
      - run: npm -v
      - run: ls -la

      - name: Install dependencies
        run: npm ci --verbose

      - run: npm run lint